name: Release

on:
  release:
    types: [published]

# No job gets more than it needs: the build runs without write access, and
# only the small upload job may write to the release.
permissions: {}

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag must match the manifest version
        run: |
          version="$(python3 -c "import json; print(json.load(open('custom_components/vital_rings/manifest.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest.json says $version but the release tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the card
        working-directory: card
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: The released bundle must be the committed one
        run: git diff --exit-code -- custom_components/vital_rings/frontend

      - name: Zip the integration
        working-directory: custom_components/vital_rings
        run: zip -r "$GITHUB_WORKSPACE/vital_rings.zip" . -x "*/__pycache__/*" "__pycache__/*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            vital_rings.zip
            custom_components/vital_rings/frontend/vital-rings-card.js
          if-no-files-found: error

  upload:
    name: Attach the files to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" vital_rings.zip \
            custom_components/vital_rings/frontend/vital-rings-card.js --clobber
